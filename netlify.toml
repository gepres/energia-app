# Repaso energético · https://energia.genaropretill.com/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /old es la versión de trabajo (el home anterior, para seguir revisando ejercicios):
# la misma app, que elige el home según la ruta.
[[redirects]]
  from = "/old"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/old/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/old*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Los archivos con hash no cambian: caché larga. El index, el service worker y el manifest, siempre frescos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
